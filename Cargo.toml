[workspace]
resolver = "2"
members = ["crates/vault-core", "crates/brain-cli", "crates/qa", "crates/janitor", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
rayon = "1"
walkdir = "2"
notify-debouncer-mini = "0.4"
clap = { version = "4", features = ["derive"] }
regex = "1"

[profile.release]
lto = "thin"
strip = true
